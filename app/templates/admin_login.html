{% extends "base.html" %}
{% block title %}Admin — CreatorGate{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-card" data-testid="admin-login-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center gap-2 mb-3">
        <i class="bi bi-shield-lock-fill" style="font-size:22px;color:var(--cg-primary)"></i>
        <span class="h-outfit" style="font-size:24px;font-weight:700">CreatorGate</span>
      </div>
      <h2 class="h-outfit" style="font-size:22px">Acesso administrativo</h2>
      <p class="text-muted small">Área restrita</p>
    </div>

    {% if error %}
    <div class="alert alert-danger small" data-testid="admin-login-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/api/admin/login" data-testid="admin-login-form">
      <div class="mb-3">
        <label class="small-label mb-1">Usuário</label>
        <input type="text" name="username" required class="form-control"
               data-testid="admin-login-username" autofocus>
      </div>
      <div class="mb-3">
        <label class="small-label mb-1">Senha</label>
        <input type="password" name="password" required class="form-control"
               data-testid="admin-login-password">
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-100 py-2" data-testid="admin-login-submit">
        <i class="bi bi-shield-check me-1"></i> Entrar como admin
      </button>
    </form>

    <div class="text-center mt-4 small text-muted">
      <a href="/api/" class="text-decoration-none">← Voltar à loja</a>
    </div>
  </div>
</div>
{% endblock %}

{# Seller sidebar with tickets + notifications #}
<aside class="cg-sidebar" data-testid="seller-sidebar">
  <a href="/api/seller" class="brand"><span class="dot"></span> CreatorGate</a>
  <div class="nav-section">{{ seller.store_name if seller else 'Vendedor' }}</div>
  <a class="nav-link {% if active=='dashboard' %}active{% endif %}" href="/api/seller" data-testid="nav-dashboard"><i class="bi bi-grid"></i> Dashboard</a>
  <a class="nav-link {% if active=='products' %}active{% endif %}" href="/api/seller/products" data-testid="nav-products"><i class="bi bi-box-seam"></i> Meus produtos</a>
  <a class="nav-link {% if active=='sales' %}active{% endif %}" href="/api/seller/sales" data-testid="nav-sales"><i class="bi bi-receipt"></i> Vendas</a>
  <a class="nav-link {% if active=='wallet' %}active{% endif %}" href="/api/seller/wallet" data-testid="nav-wallet"><i class="bi bi-wallet2"></i> Carteira</a>
  <a class="nav-link {% if active=='tickets' %}active{% endif %}" href="/api/seller/tickets" data-testid="nav-tickets">
    <i class="bi bi-life-preserver"></i> Suporte / Tickets
  </a>
  <a class="nav-link {% if active=='profile' %}active{% endif %}" href="/api/seller/profile" data-testid="nav-profile"><i class="bi bi-person-gear"></i> Perfil / Loja</a>
  {% if seller %}
  <div class="nav-section">Loja pública</div>
  <a class="nav-link" href="/api/s/{{ seller.slug }}" target="_blank" data-testid="nav-public-store"><i class="bi bi-box-arrow-up-right"></i> Ver loja</a>
  {% endif %}
  <hr class="my-3">
  <a class="nav-link" href="/api/logout" data-testid="nav-logout"><i class="bi bi-box-arrow-right"></i> Sair</a>
</aside>

<div class="cg-notif-bell" data-testid="notif-bell">
  <button class="btn btn-light position-relative" id="notifBtn" aria-label="Notificações">
    <i class="bi bi-bell"></i>
    <span id="notif-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;font-size:10px"></span>
  </button>
  <div id="notifPanel" class="cg-notif-panel" style="display:none">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <strong>Notificações</strong>
      <button id="notifMarkAll" class="btn btn-sm btn-link p-0" style="font-size:12px">Marcar todas como lidas</button>
    </div>
    <div id="notifList"></div>
  </div>
</div>
<script>window.CG_NOTIF_BASE = '/api/seller';</script>
